name: Build Mobile Harness APK

# Manual only, by design: this is a personal build-and-download workflow.
# It never creates a release and never commits the APK it produces.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Android SDK components required by app/build.gradle.kts
  SDK_PLATFORM: android-36
  SDK_BUILD_TOOLS: 36.0.0
  SDK_NDK: 26.1.10909125
  SDK_CMAKE: 3.22.1

jobs:
  apk:
    name: Online debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Guard target branch
        run: |
          # Exact pattern matching: the stable integration branch, or a design
          # branch with a non-empty name. Nothing else, including main.
          case "${{ github.ref_name }}" in
            fix/oom-and-shared-folder|design/?*) ;;
            *)
              echo "::error::Unsupported branch '${{ github.ref_name }}'."
              echo "::error::Allowed branches: 'fix/oom-and-shared-folder' or a non-empty 'design/*' branch."
              exit 1
              ;;
          esac

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # Build the branch selected for workflow_dispatch, not a pinned ref.
          ref: ${{ github.ref_name }}
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # android-actions/setup-android is deliberately not used: its own
      # `sdkmanager tools` call fails on cmdline-tools 16.0 ("Failed to find
      # package 'tools'") and aborts the job. The runner image already ships
      # the command line tools; it just does not put them on PATH.
      - name: Install Android SDK, NDK and CMake
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          CMDLINE_TOOLS="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          echo "SDK root: $SDK_ROOT"
          echo "cmdline-tools: $CMDLINE_TOOLS"
          # SIGPIPE from `yes` when sdkmanager stops reading is expected.
          yes | "$CMDLINE_TOOLS/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$CMDLINE_TOOLS/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platforms;${SDK_PLATFORM}" \
            "build-tools;${SDK_BUILD_TOOLS}" \
            "platform-tools" \
            "ndk;${SDK_NDK}" \
            "cmake;${SDK_CMAKE}"
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${SDK_NDK}"
            echo "$CMDLINE_TOOLS/bin"
          } >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${SDK_NDK}" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The signing key must come from a secret so every run produces the same
      # signature as the app already installed on the phone. A runner-generated
      # debug keystore would be different every time and could not update it.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MH_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret MH_DEBUG_KEYSTORE_BASE64 is not set; the APK would be signed with a throwaway key."
            exit 1
          fi
          STORE="$HOME/.android/debug.keystore"
          # AGP resolves the debug keystore to ~/.config/.android on this image
          # (see :app:signingReport), so both paths get the same file.
          STORE_CONFIG="$HOME/.config/.android/debug.keystore"
          mkdir -p "$HOME/.android" "$HOME/.config/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$STORE"
          cp "$STORE" "$STORE_CONFIG"
          chmod 600 "$STORE" "$STORE_CONFIG"
          echo "keystore: $STORE"
          echo "keystore: $STORE_CONFIG"
          export LC_ALL=C LANG=C
          keytool -list -v -keystore "$STORE" \
            -storepass android -alias androiddebugkey \
            > "$RUNNER_TEMP/restored-keytool.txt"
          grep -E "Alias name|Valid from|SHA256:" "$RUNNER_TEMP/restored-keytool.txt"

      # Diagnostic only: report where Android looks for its user home and which
      # keystore AGP signs the onlineDebug variant with. The resolved Store path
      # is authoritative. Prints selected non-secret paths and public
      # certificate data only.
      - name: Report debug signing configuration
        run: |
          set -eu
          echo "== Android user home paths =="
          echo "HOME=$HOME"
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-<unset>}"
          echo "ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-<unset>}"
          echo "ANDROID_PREFS_ROOT=${ANDROID_PREFS_ROOT:-<unset>}"
          echo "GRADLE_USER_HOME=${GRADLE_USER_HOME:-<unset>}"
          echo "== AGP signing report (authoritative Store path) =="
          ./gradlew --no-daemon :app:signingReport

      # Unit tests first: no APK is packaged if they fail.
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testOnlineDebugUnitTest

      - name: Assemble online debug APK
        run: ./gradlew --no-daemon :app:assembleOnlineDebug

      # Gate: the packaged APK must carry the restored keystore's certificate,
      # otherwise the phone would reject the update. Public fingerprints only;
      # no key material is printed.
      - name: Verify APK signature matches the restored keystore
        run: |
          set -euo pipefail
          export LC_ALL=C LANG=C
          APK="app/build/outputs/apk/online/debug/app-online-debug.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/$SDK_BUILD_TOOLS/apksigner"
          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK not found at $APK"
            exit 1
          fi
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner not found or not executable at $APKSIGNER"
            exit 1
          fi
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-certs.txt"
          cat "$RUNNER_TEMP/apk-certs.txt"
          APK_SHA="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-certs.txt" \
            | tr -d ':' | tr 'A-Z' 'a-z')"
          KS_SHA="$(sed -n 's/^[[:space:]]*SHA256: //p' "$RUNNER_TEMP/restored-keytool.txt" \
            | tr -d ':' | tr 'A-Z' 'a-z')"
          echo "APK signing certificate SHA-256 : $APK_SHA"
          echo "Restored keystore certificate   : $KS_SHA"
          case "$APK_SHA" in
            *[!0-9a-f]*|"") echo "::error::APK certificate fingerprint is not 64 hex characters."; exit 1 ;;
          esac
          case "$KS_SHA" in
            *[!0-9a-f]*|"") echo "::error::Keystore certificate fingerprint is not 64 hex characters."; exit 1 ;;
          esac
          if [ "${#APK_SHA}" -ne 64 ] || [ "${#KS_SHA}" -ne 64 ]; then
            echo "::error::Fingerprints must each be exactly 64 hex characters."
            exit 1
          fi
          if [ "$APK_SHA" != "$KS_SHA" ]; then
            echo "::error::APK signature does not match the restored keystore; refusing to upload."
            exit 1
          fi
          echo "APK signature matches the restored keystore."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-online-debug
          path: app/build/outputs/apk/online/debug/app-online-debug.apk
          if-no-files-found: error
          retention-days: 14
